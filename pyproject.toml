[project]
name = "nomad-distribution"
description = "nomad distribution template"
version = "0.1"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "nomad-gui",
  # nomad-lab is the package of the nomad-FAIR repository (packages/nomad-FAIR)
  "nomad-lab[infrastructure]>=1.3.10",
  "nomad-simulations",
  "nomad-simulation-parsers",
  "nomad-file-parser",
  "nomad-results-normalizer",
]

[tool.uv.workspace]
members = ["packages/*"]
# Data-only submodule (no pyproject.toml), not a workspace member.
exclude = ["packages/nomad-simulation-parser-test-fixtures"]

[tool.uv.sources]
# nomad-lab is provided by the nomad-FAIR repository, checked out at packages/nomad-FAIR
nomad-lab = { workspace = true }
# The nomad-gui Python package lives in the infra/ subdirectory; the repo root
# is the Vite/React app and carries no pyproject.toml.
nomad-gui = { git = "https://gitlab.mpcdf.mpg.de/nomad-lab/nomad-gui.git", branch = "develop", subdirectory = "infra" }
nomad-simulations = { workspace = true }
nomad-simulation-parsers = { workspace = true }
nomad-file-parser = { workspace = true }
nomad-results-normalizer = { workspace = true }
nomad-aitoolkit = { git = "https://github.com/FAIRmat-NFDI/nomad-aitoolkit.git", rev = "b203f8eb28dc4b6771a39d5c5b7ad3d9d8583ac8" }
nomad-porous-materials = { git = "https://github.com/FAIRmat-NFDI/nomad-porous-materials.git", rev = "522f4a3208077f534f1c5e886527ee2104283d0b" }
perovskite-solar-cell-database = { git = "https://github.com/FAIRmat-NFDI/nomad-perovskite-solar-cells-database.git", tag = "v0.1.1" }
nomad-external-eln-integrations = { git = "https://github.com/FAIRmat-NFDI/nomad-external-eln-integrations", rev = "de8050effb510fc2be0974cb08d44b475791b0a5" }

[tool.distro.packages]
# Branch each package under packages/ follows (uv ignores this table). Read by `poe track`,
# written by `poe record`; the exact commits are the submodule pointers (`poe pin`).
"nomad-FAIR" = "develop"
"nomad-simulations" = "develop"
"nomad-file-parser" = "develop"
"nomad-simulation-parsers" = "develop"
"nomad-simulation-parser-test-fixtures" = "main"
"nomad-results-normalizer" = "main"

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
required-version = ">=0.5.14"
constraint-dependencies = ["flatdict>=4.1.0"]
# nomad-simulation-parsers pins these to git+...@develop; the overrides drop the
# pins so resolution falls back to the local workspace checkouts (see
# "Overriding a dependent's version pin" in the nomad-distro-dev README).
override-dependencies = ["nomad-simulations", "nomad-file-parser"]

[dependency-groups]
dev = [
  "nomad-lab[infrastructure, dev]>=1.3.4",
  "nomad-simulations[dev]",
  "nomad-simulation-parsers[dev]",
  "nomad-file-parser[dev]",
  "nomad-results-normalizer[dev]",
  "poethepoet>=0.29.0",
]
# Molecular-dynamics extras of the workspace packages, opt-in via
# `uv sync --group md`. Currently a formality: MDAnalysis is a core
# dependency of nomad-simulation-parsers, so the MD stack is installed
# regardless.
md = ["nomad-simulations[md]", "nomad-simulation-parsers[md]"]

[tool.poe.tasks]
submodule = "git submodule update --init --recursive"
# Package checkouts <-> recorded state ([tool.distro.packages], submodule pointers); -n for a dry run.
track = "python scripts/packages.py track"
record = "python scripts/packages.py record"
pin = "python scripts/packages.py pin"
# Merge the package pull requests of a coordinated change (README protocol): `poe merge-prs <branch> [-n]`.
merge-prs = "python scripts/merge_prs.py"
docker = "docker compose up -d"
setup = ["docker", "config"]
lint = ["ruff-lint", "ruff-format"]

[tool.poe.tasks.start]
cmd = "nomad admin run appworker --dev"
deps = ["start-info"]
env = { NOMAD_SERVICES_MODE = "development" }

[tool.poe.tasks.start-info]
cmd = "python -c \"print('NOMAD GUI: http://localhost:8000/nomad-oasis/gui/v2/')\""
verbosity = -1

[tool.poe.tasks.cpuworker]
cmd = "nomad admin run action-cpu-worker"
env = { NOMAD_SERVICES_MODE = "development" }

[tool.poe.tasks.gpuworker]
cmd = "nomad admin run action-gpu-worker"
env = { NOMAD_SERVICES_MODE = "development" }

[tool.poe.tasks.config]
shell = """
import os;
if not os.path.exists("nomad.yaml"):
    with open("nomad.yaml", "w") as f:
        f.write("keycloak:\\n  realm_name: \\"fairdi_nomad_test\\"\\n")
"""
interpreter = "python"

# Static snapshot of the v2 GUI metainfo (the backend serves the same content
# live under /nomad-oasis/gui/v2/metainfo.js).
[tool.poe.tasks.metainfo]
cmd = "python -W ignore -c \"from nomad_gui.apis import generate_metainfo; print(generate_metainfo())\""
capture_stdout = "metainfo.js"

[tool.poe.tasks.gui-env]
cmd = "python -W ignore -m nomad.cli dev gui-env"
capture_stdout = "packages/nomad-FAIR/gui/.env.development"

[tool.poe.tasks.docs]
cmd = "mkdocs serve"
cwd = "packages/nomad-docs"

[tool.poe.tasks.ruff-lint]
cmd = "ruff check ."

[tool.poe.tasks.ruff-format]
cmd = "ruff format . --check"

[tool.poe.tasks.hub]
cmd = "nomad admin run hub"
cwd = "packages/nomad-FAIR"

[tool.poe.tasks.gui]
control.expr = "sys.platform"

[[tool.poe.tasks.gui.switch]]
case = "win32"
cmd = "yarn.cmd run start"
cwd = "packages/nomad-FAIR/gui"

[[tool.poe.tasks.gui.switch]]
cmd = "yarn run start"
cwd = "packages/nomad-FAIR/gui"

[tool.poe.tasks.gui-setup]
sequence = ["gui-env", "gui-install"]

[tool.poe.tasks.gui-install]
control.expr = "sys.platform"

[[tool.poe.tasks.gui-install.switch]]
case = "win32"
cmd = "yarn.cmd"
cwd = "packages/nomad-FAIR/gui"

[[tool.poe.tasks.gui-install.switch]]
cmd = "yarn"
cwd = "packages/nomad-FAIR/gui"

[tool.poe.tasks.gen-gui-test-env]
cmd = "python -W ignore -m nomad.cli dev gui-config"
capture_stdout = "packages/nomad-FAIR/gui/tests/env.js"
env = { NOMAD_CONFIG = "packages/nomad-FAIR/gui/tests/nomad.yaml" }

[tool.poe.tasks.gen-nomad-lock]
cmd = "uv pip compile -U --universal -p 3.11 --extra infrastructure --extra dev --annotation-style=line pyproject.toml requirements.txt"
capture_stdout = "packages/nomad-FAIR/requirements-dev.txt"
cwd = "packages/nomad-FAIR"
deps = ["gen-nomad-lock-without-dev"]

[tool.poe.tasks.gen-nomad-lock-without-dev]
cmd = "uv pip compile -U --universal -p 3.11 --extra infrastructure --annotation-style=line pyproject.toml"
cwd = "packages/nomad-FAIR"
capture_stdout = "packages/nomad-FAIR/requirements.txt"
